<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Export Complete — ComicCraft</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body class="landing">
  <main class="shell center">
    <section class="card success">
      <div class="success-icon">✓</div>
      <span class="eyebrow">EXPORT COMPLETE</span>
      <h1>Your comic is ready.</h1>
      <p>The PDF has been generated successfully.</p>
      {% if pdf_path %}<a class="primary" href="{{ pdf_path }}">Download PDF</a>{% endif %}
      <a class="secondary" href="/">Go Create Another Comic</a>
    </section>
  </main>
</body>
</html>
